name: Quick Capture Windows x64
on:
  workflow_dispatch:
  push:
    branches: [quickcapture, main]
  pull_request:
    branches: [quickcapture, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build and smoke-test portable distribution
        shell: pwsh
        run: ./Build-QuickCapture.ps1
      - name: Package portable application and SHA256
        shell: pwsh
        run: |
          Compress-Archive -Path dist/QuickCapture-win-x64/* -DestinationPath dist/QuickCapture-win-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist/QuickCapture-win-x64.zip).Hash
          "$hash  QuickCapture-win-x64.zip" | Set-Content dist/QuickCapture-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: QuickCapture-win-x64
          path: |
            dist/QuickCapture-win-x64.zip
            dist/QuickCapture-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
